<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おすすめの厳選情報 | Japan Product Deals</title>

  <!-- Social Media Card Preview for X (Twitter) -->
  <meta property="og:title" content="【注目アイテム】ビオレ おうちdeエステ ディープクレイ洗顔">
  <meta property="og:description" content="毛穴の黒ずみ汚れ・隠れ角栓まで分解＆吸着！つるんとした毛穴レス肌へ導く話題のディープクレイ洗顔。">
  <meta property="og:image" content="https://m.media-amazon.com/images/W/BW_MEDIAX_AVIF_MEASUREMENT_1306696-T4/images/I/51kmyQUKzPL._AC_SL1000_.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f3f3;
      margin: 0;
      padding: 16px;
      color: #0f1111;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 12px 0 20px;
    }
    .header h1 {
      font-size: 1.3rem;
      margin: 0 0 6px 0;
      color: #111;
    }
    .disclosure {
      font-size: 0.75rem;
      color: #565959;
      background: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e7e7e7;
    }
    .product-card img {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .product-card h3 {
      font-size: 1.05rem;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
    .product-card p {
      font-size: 0.88rem;
      color: #333;
      margin: 0 0 16px 0;
      line-height: 1.5;
    }
    .buy-btn {
      display: block;
      width: 100%;
      background-color: #ffd814;
      border: 1px solid #fcd200;
      border-radius: 20px;
      padding: 12px 0;
      font-size: 0.95rem;
      font-weight: bold;
      color: #0f1111;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(213,217,217,.5);
    }
    .buy-btn:active {
      background-color: #f7ca00;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Japan Product Picks</h1>
    </div>

    <!-- Hidden Associate Tag Input -->
    <div style="display:none;">
      <input type="text" id="tagInput" value="ibjapanstore-22">
    </div>

    <div class="disclosure">
      Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。商品価格や在庫状況は最新の情報をご確認ください。
    </div>

    <!-- PRODUCT CARD -->
    <div class="product-card" id="biore-clay">
      <img src="https://m.media-amazon.com/images/W/BW_MEDIAX_AVIF_MEASUREMENT_1306696-T4/images/I/51kmyQUKzPL._AC_SL1000_.jpg" alt="ビオレ おうちdeエステ ディープクレイ洗顔">
      <h3>ビオレ おうちdeエステ ディープクレイ洗顔 (角栓崩壊ブースト)</h3>
      <p>SNSでバズり中の毛穴ケア洗顔！新開発の角栓崩壊技術で、小鼻の黒ずみ汚れや隠れ角栓までしっかり洗浄。ザラつきのないなめらかなつるん肌へ。</p>
      <button class="buy-btn" onclick="redirectAmazon(event, 'B0GL776DRB')">Amazon.co.jp で詳細を見る</button>
    </div>

  </div>

  <script>
    function getTag() {
      return localStorage.getItem('amazonTag') || 'ibjapanstore-22';
    }

    function redirectAmazon(event, asin) {
      event.preventDefault();
      const tag = getTag();
      const targetUrl = `https://www.amazon.co.jp/dp/${asin}?tag=${tag}`;
      window.location.href = targetUrl;
    }
  </script>

</body>
</html>
